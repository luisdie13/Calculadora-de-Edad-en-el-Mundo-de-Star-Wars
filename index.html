<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad en Star Wars</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Edad en el Mundo de Star Wars 🌌</h1>
        <p>Descubre tu edad equivalente en diferentes especies del universo de Star Wars.</p>
        
        <form id="ageForm">
            <label for="humanAge">Ingresa tu edad (en años terrestres):</label>
            <input type="number" id="humanAge" placeholder="Ej: 25" min="0" required>
            
            <label for="species">Selecciona una especie:</label>
            <select id="species" required>
                <option value="80">Humano</option>
                <option value="400">Wookiee</option>
                <option value="900">Yoda’s species</option>
                <option value="85">Twi’lek</option>
                <option value="60">Ewok</option>
            </select>
            
            <button type="submit">Calcular</button>
        </form>

        <div id="result" class="hidden">
            <h2>Resultado</h2>
            <p>Tu edad equivalente en <span id="selectedSpecies"></span> es: <span id="equivalentAge"></span> años.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
